<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SummitTrails</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }

    .st-nav {
      background: #185FA5;
      padding: 0 24px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .st-brand {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .st-nav-links a {
      color: #B5D4F4;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      transition: color 0.2s;
    }
    .st-nav-links a:hover { color: #fff; }

    .st-hero {
      background: linear-gradient(135deg, #0C447C 0%, #185FA5 100%);
      padding: 60px 24px;
      text-align: center;
    }
    .st-hero h1 { color: #fff; font-size: 32px; font-weight: 600; margin-bottom: 10px; }
    .st-hero p { color: #B5D4F4; font-size: 16px; margin-bottom: 28px; }

    .st-search {
      display: flex;
      gap: 8px;
      max-width: 520px;
      margin: 0 auto;
    }
    .st-search input {
      flex: 1;
      padding: 11px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      outline: none;
    }
    .st-search button {
      background: #378ADD;
      color: #fff;
      border: none;
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .st-card {
      background: #fff;
      border-radius: 12px;
      border: 0.5px solid #dde4ed;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .st-card:hover { box-shadow: 0 4px 16px rgba(24,95,165,0.12); }

    .trek-img-placeholder {
      height: 110px;
      background: #0C447C;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .trek-img-placeholder i { font-size: 40px; color: #B5D4F4; }

    .badge-difficulty {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-Easy { background: #EAF3DE; color: #3B6D11; }
    .badge-Moderate { background: #FAEEDA; color: #854F0B; }
    .badge-Hard { background: #FCEBEB; color: #A32D2D; }

    .btn-primary-st {
      background: #185FA5;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-primary-st:hover { background: #0C447C; }

    .btn-outline-st {
      background: transparent;
      color: #185FA5;
      border: 1px solid #185FA5;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline-st:hover { background: #185FA5; color: #fff; }

    .stat-box {
      background: #fff;
      border-radius: 10px;
      border: 0.5px solid #dde4ed;
      padding: 16px;
      text-align: center;
    }
    .stat-box .num { font-size: 26px; font-weight: 600; color: #185FA5; }
    .stat-box .lbl { font-size: 12px; color: #6c757d; margin-top: 2px; }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #0C447C;
      margin-bottom: 16px;
    }

    .alert-st {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .alert-success { background: #EAF3DE; color: #3B6D11; }
    .alert-danger { background: #FCEBEB; color: #A32D2D; }

    .table-st { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table-st th { background: #E6F1FB; color: #0C447C; font-weight: 600; padding: 10px 12px; text-align: left; }
    .table-st td { padding: 10px 12px; border-bottom: 0.5px solid #dde4ed; color: #333; }
    .table-st tr:last-child td { border-bottom: none; }
    .table-st tr:hover td { background: #f7fafd; }

    .sidebar {
      background: #0C447C;
      min-height: 100vh;
      width: 220px;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 70px;
    }
    .sidebar a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #B5D4F4;
      text-decoration: none;
      padding: 12px 20px;
      font-size: 14px;
      transition: all 0.2s;
    }
    .sidebar a:hover, .sidebar a.active { background: #185FA5; color: #fff; }
    .sidebar a i { font-size: 18px; }

    .main-with-sidebar { margin-left: 220px; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
    }
    .modal-box h5 { font-size: 17px; font-weight: 600; color: #0C447C; margin-bottom: 18px; }

    .form-label-st { font-size: 13px; color: #555; margin-bottom: 4px; display: block; }
    .form-input-st {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cdd5df;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      margin-bottom: 14px;
    }
    .form-input-st:focus { border-color: #185FA5; }

    [v-cloak] { display: none; }
  </style>
</head>
<body>

  <div id="app" v-cloak>
    <login-page v-if="currentPage === 'login'" @login-success="handleLogin"></login-page>
    <admin-dash v-else-if="currentPage === 'admin'" @logout="handleLogout"></admin-dash>
    <staff-dash v-else-if="currentPage === 'staff'" @logout="handleLogout"></staff-dash>
    <user-dash v-else-if="currentPage === 'user'" @logout="handleLogout"></user-dash>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="pages/Login.js"></script>
  <script src="pages/AdminDash.js"></script>
  <script src="pages/StaffDash.js"></script>
  <script src="pages/UserDash.js"></script>

  <script src="index.js"></script>

</body>
</html>
